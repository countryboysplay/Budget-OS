<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0E1223" media="(prefers-color-scheme: dark)">
  <title>Budget OS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Fira+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-refresh" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/>
    <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/>
  </symbol>
  <symbol id="i-search" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>
  </symbol>
  <symbol id="i-sort" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="m7 15 5 5 5-5"/><path d="m7 9 5-5 5 5"/>
  </symbol>
  <symbol id="i-up" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="m18 15-6-6-6 6"/>
  </symbol>
  <symbol id="i-down" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="m6 9 6 6 6-6"/>
  </symbol>
  <symbol id="i-alert" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/>
  </symbol>
  <symbol id="i-inbox" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="22 12 16 12 14 15 10 15 8 12 2 12"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/>
  </symbol>
</svg>

<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <span class="brand-name">Budget OS</span>
      <span class="brand-sub">Sales vs. budget</span>
    </div>
    <nav class="locations" id="locations" aria-label="Location"></nav>
    <div class="topbar-status">
      <span class="status" id="status" aria-live="polite"></span>
      <button type="button" class="btn-icon" id="refresh" aria-label="Refresh data">
        <svg class="icon"><use href="#i-refresh"/></svg>
        <span class="btn-icon-text">Refresh</span>
      </button>
    </div>
  </div>
</header>

<main class="page" id="main" aria-busy="true">

  <section class="kpis" id="kpis" aria-label="Year to date summary">
    <h1 class="sr-only" id="summary-title">Summary</h1>
    <article class="kpi">
      <p class="kpi-label">Net sales so far</p>
      <p class="kpi-value" id="f-ytd"><span class="skel skel-value"></span></p>
      <p class="kpi-note" id="n-ytd"></p>
    </article>
    <article class="kpi">
      <p class="kpi-label">Projected year end</p>
      <p class="kpi-value" id="f-est"><span class="skel skel-value"></span></p>
      <div class="kpi-bar" id="bar-wrap" hidden>
        <div class="kpi-bar-track" role="progressbar" id="bar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="Projected year end as a share of budget">
          <div class="kpi-bar-fill" id="bar-fill"></div>
        </div>
        <p class="kpi-note" id="n-est"></p>
      </div>
    </article>
    <article class="kpi">
      <p class="kpi-label">Year-end budget</p>
      <p class="kpi-value" id="f-budget"><span class="skel skel-value"></span></p>
      <p class="kpi-note" id="n-budget"></p>
    </article>
    <article class="kpi kpi-variance">
      <p class="kpi-label">Projected vs. budget</p>
      <p class="kpi-value" id="f-variance"><span class="skel skel-value"></span></p>
      <p class="kpi-note" id="n-variance"></p>
    </article>
  </section>

  <section class="toolbar" aria-label="Table controls">
    <div class="search">
      <svg class="icon search-icon" aria-hidden="true"><use href="#i-search"/></svg>
      <label for="search" class="sr-only">Find a category</label>
      <input type="search" id="search" placeholder="Find a category" autocomplete="off" enterkeyhint="search">
    </div>
    <label class="switch">
      <input type="checkbox" id="hide-empty" checked>
      <span class="switch-track" aria-hidden="true"></span>
      <span class="switch-text">Hide empty rows</span>
    </label>
    <label class="switch">
      <input type="checkbox" id="all-cols">
      <span class="switch-track" aria-hidden="true"></span>
      <span class="switch-text">All columns</span>
    </label>
    <p class="row-count" id="row-count" aria-live="polite"></p>
  </section>

  <section class="table-card">
    <div class="table-scroll" id="table-scroll" tabindex="0" aria-label="Sales categories table, scrolls sideways">
      <table id="table" class="data">
        <thead>
          <tr class="groups" id="groups">
            <th scope="col" class="col-cat"></th>
            <th scope="colgroup" colspan="8" class="group">Customers</th>
            <th scope="colgroup" colspan="5" class="group group-dollars">Sales dollars</th>
          </tr>
          <tr class="heads" id="heads"></tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </section>

  <section class="notice" id="notice" hidden role="status"></section>

  <footer class="foot">
    <p>Numbers come from each location's sales comparison workbook and update when it's saved on the office PC.</p>
  </footer>
</main>

<script src="app.js"></script>
</body>
</html>
